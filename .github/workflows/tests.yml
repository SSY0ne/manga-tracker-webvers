name: Tests

# Runs the rule tests when Python code changes. The daily bot only changes state.json and
# history.jsonl, so it does not trigger this.
on:
  push:
    paths:
      - "*.py"
      - "*.js"
      - "reference_counts.json"
      - "index.html"
      - "fixtures/**"
      - ".github/workflows/*.yml"
      - ".github/dependabot.yml"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the rule tests, the recorded-fixture tests and the page-script checks
        run: python3 -m unittest -v test_rules test_fixtures test_js test_reference test_bot test_workflows
