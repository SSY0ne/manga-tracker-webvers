name: Tests

# Runs the rule tests when Python code changes. The daily bot only changes state.json and
# history.jsonl, so it does not trigger this.
on:
  push:
    paths:
      - "*.py"
      - "fixtures/**"
      - ".github/workflows/tests.yml"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the rule tests and the recorded-fixture tests
        run: python3 -m unittest -v test_rules test_fixtures
